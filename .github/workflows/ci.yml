name: CI

on:
  pull_request:
  # Permite lanzarla a mano desde la pestaña Actions o con gh workflow run.
  workflow_dispatch:
  push:
    branches: [main, develop]

# El flujo solo necesita leer el código: sin permisos de escritura sobre el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Las acciones se fijan por el hash del commit: una etiqueta como v7 puede moverse.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 21

      # Además de la caché, comprueba que gradle-wrapper.jar es el oficial de Gradle.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tests y aplicación de escritorio
        run: ./gradlew :crypto:test :core:test :shared:jvmTest :app-desktop:assemble

      - name: Aplicación Android
        if: runner.os == 'Linux'
        run: ./gradlew :app-android:assembleDebug
